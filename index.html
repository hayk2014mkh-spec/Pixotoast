<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Studio — Ռեալիստիկ Տոստերի Ստուդիա</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #fff5f8;
      --pink-50: #fff0f5;
      --pink-100: #ffe0eb;
      --pink-200: #ffc2d9;
      --pink-300: #ff94bd;
      --pink-400: #ff5c9d;
      --pink-500: #ff2e82;
      --pink-600: #e01b6c;
      --text-dark: #3b1d2a;
      --text-muted: #8c6273;
      --shadow-soft: 0 14px 36px rgba(255, 46, 130, 0.14);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Armenian', sans-serif;
      background: radial-gradient(circle at top left, #ffe4ef 0%, #fff7fa 48%, #ffedf4 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }
    .blob-1 { width: 380px; height: 380px; background: #ffc2d9; top: -90px; right: -70px; }
    .blob-2 { width: 340px; height: 340px; background: #ffd6e6; bottom: -70px; left: -70px; }

    header {
      position: relative;
      z-index: 10;
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(255, 46, 130, 0.28);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
    }

    .brand span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);
      border: 1.5px solid var(--pink-200);
    }
    .btn-ghost:hover {
      background: var(--pink-50);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(255, 46, 130, 0.32);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 26px rgba(255, 46, 130, 0.42);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Հիմնական դասավորություն */
    .studio-layout {
      position: relative;
      z-index: 10;
      max-width: 1360px;
      margin: 0 auto;
      padding: 8px 28px 50px;
      display: grid;
      grid-template-columns: 470px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 1020px) {
      .studio-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Ձախ վահանակ՝ Տոստեր և Ափսե */
    .preview-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      border: 2px solid #ffffff;
      border-radius: var(--radius-lg);
      padding: 22px 24px 26px;
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 16px;
      text-align: center;
    }

    .chef-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--pink-600);
      margin-bottom: 12px;
    }

    /* Իրական աշխատող վարդագույն տոստերի հատված */
    .toaster-zone {
      position: relative;
      height: 155px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .toaster-bread-slot {
      position: absolute;
      bottom: 48px;
      width: 104px;
      height: 104px;
      z-index: 1;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
      opacity: 0;
      transform: translateY(35px) scale(0.85);
      pointer-events: none;
    }

    .toaster-bread-slot.in-toaster {
      opacity: 1;
      transform: translateY(38px) scale(0.92);
    }

    .toaster-bread-slot.popping-out {
      opacity: 1;
      transform: translateY(-28px) scale(1.02);
    }

    .toaster-body {
      position: relative;
      z-index: 3;
      width: 210px;
      height: 92px;
      border-radius: 32px 32px 16px 16px;
      background: linear-gradient(145deg, #ff85b6 0%, #ff4791 55%, #d91e6b 100%);
      box-shadow:
        0 14px 26px rgba(217, 30, 107, 0.28),
        inset 0 6px 14px rgba(255, 255, 255, 0.65),
        inset 0 -8px 14px rgba(150, 14, 70, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffb8d4;
    }

    .toaster-slot-top {
      position: absolute;
      top: -6px;
      width: 136px;
      height: 12px;
      background: #471429;
      border-radius: 999px;
      box-shadow: inset 0 3px 6px #000000;
      z-index: 2;
    }

    .toaster-glow {
      position: absolute;
      top: -4px;
      width: 124px;
      height: 8px;
      border-radius: 999px;
      background: #ff6b00;
      box-shadow: 0 0 18px 6px rgba(255, 115, 0, 0.85);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }
    .toaster-body.heating .toaster-glow {
      opacity: 1;
    }

    .toaster-chrome-base {
      position: absolute;
      bottom: -6px;
      width: 222px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e0d6da, #ffffff, #cfc2c7);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .toaster-lever {
      position: absolute;
      right: -16px;
      top: 24px;
      width: 16px;
      height: 36px;
      background: linear-gradient(180deg, #ffffff, #ffd6e6);
      border-radius: 0 10px 10px 0;
      border: 1.5px solid #ff94bd;
      transition: transform 0.35s ease;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.12);
    }

    .toaster-body.heating .toaster-lever {
      transform: translateY(26px);
    }

    .toaster-dial {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #ffd6e6);
      border: 2px solid #ff94bd;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      position: absolute;
      left: 22px;
      bottom: 18px;
    }

    .toast-action-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* Ափսե և Ազատ Drag & Drop հարթակ */
    .plate-stage {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .plate {
      position: absolute;
      width: 326px;
      height: 326px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #fff7fa 62%, #ffd9e8 100%);
      box-shadow:
        0 22px 44px rgba(224, 27, 108, 0.16),
        inset 0 6px 14px rgba(255, 255, 255, 1),
        inset 0 -10px 22px rgba(255, 175, 207, 0.5);
      border: 6px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s ease;
    }

    .plate.drag-over {
      box-shadow:
        0 0 0 6px rgba(255, 46, 130, 0.25),
        0 22px 44px rgba(224, 27, 108, 0.22);
    }

    .plate-inner-ring {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 1.5px dashed var(--pink-200);
      opacity: 0.75;
    }

    #toast-canvas {
      position: relative;
      width: 300px;
      height: 300px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bread-layer {
      position: absolute;
      width: 230px;
      height: 230px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 14px 20px rgba(59, 29, 42, 0.22));
      pointer-events: none;
    }

    .bread-layer.jumping {
      animation: breadJump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes breadJump {
      0% { transform: translateY(-90px) scale(0.75); opacity: 0.4; }
      60% { transform: translateY(8px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Տեղաշարժվող միջուկ ափսեի վրա */
    .topping-layer {
      position: absolute;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
      cursor: grab;
      filter: drop-shadow(0 6px 10px rgba(45, 20, 32, 0.26));
      transition: filter 0.15s ease;
    }

    .topping-layer:hover {
      filter: drop-shadow(0 8px 14px rgba(255, 46, 130, 0.42));
    }

    .topping-layer.dragging {
      cursor: grabbing;
      z-index: 999 !important;
      transform: translate(-50%, -50%) scale(1.14) rotate(var(--rot, 0deg));
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .selected-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-height: 76px;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .pill {
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
      color: var(--text-dark);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.18s;
    }
    .pill:hover {
      background: var(--pink-200);
    }

    .preview-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .finish-btn {
      width: 100%;
      justify-content: center;
      padding: 14px 22px;
      font-size: 15.5px;
      margin-top: 10px;
    }

    /* Աջ վահանակ՝ Հացեր և 100 միջուկ */
    .builder-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      border: 2px solid #ffffff;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }

    .section-title {
      font-size: 16.5px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title span.badge {
      font-size: 12px;
      background: var(--pink-100);
      color: var(--pink-600);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .bread-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .bread-item {
      background: var(--bg-main);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .bread-item:hover {
      transform: translateY(-3px);
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(59, 29, 42, 0.06);
    }

    .bread-item.active {
      background: #ffffff;
      border-color: var(--pink-500);
      box-shadow: 0 8px 20px rgba(255, 46, 130, 0.16);
    }

    .bread-thumb {
      width: 56px;
      height: 56px;
      margin: 0 auto 6px;
    }

    .bread-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 11px 18px 11px 40px;
      border-radius: 999px;
      border: 2px solid var(--pink-100);
      background: var(--bg-main);
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-dark);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--pink-400);
      background: #ffffff;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--pink-400);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      border: 1.5px solid var(--pink-100);
      background: #ffffff;
      color: var(--text-muted);
      padding: 7px 13px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--pink-500);
      border-color: var(--pink-500);
      color: #ffffff;
    }

    .toppings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .toppings-grid::-webkit-scrollbar {
      width: 6px;
    }
    .toppings-grid::-webkit-scrollbar-thumb {
      background: var(--pink-200);
      border-radius: 999px;
    }

    .topping-card {
      background: var(--bg-main);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 10px 6px;
      text-align: center;
      cursor: grab;
      transition: all 0.2s ease;
      position: relative;
    }

    .topping-card:hover {
      background: #ffffff;
      border-color: var(--pink-300);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(59, 29, 42, 0.06);
    }

    .topping-count-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--pink-500);
      color: white;
      font-size: 10.5px;
      font-weight: 800;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topping-svg-box {
      width: 54px;
      height: 54px;
      margin: 0 auto 5px;
    }

    .topping-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
    }

    /* Ավարտի պատուհան */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(59, 29, 42, 0.45);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 32px;
      max-width: 450px;
      width: 100%;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(224, 27, 108, 0.25);
      border: 3px solid var(--pink-100);
    }

    .modal-box h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--pink-600);
      margin: 8px 0 10px;
    }

    .modal-box p {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .recipe-summary {
      background: var(--pink-50);
      border-radius: 16px;
      padding: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .confetti {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      animation: fall 2.4s ease-out forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <header>
    <div class="brand">
      <div class="brand-icon">🍞</div>
      <div>
        <h1>Toast Studio</h1>
        <span>Տապակիր հացը տոստերում և տեղադրիր միջուկները քո ուզած տեղում</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="randomToast()">🎲 Պատահական տոստ</button>
      <button class="btn btn-ghost" onclick="clearToast()">🧹 Մաքրել</button>
    </div>
  </header>

  <main class="studio-layout">
    <!-- Ձախ վահանակ՝ Տոստեր և Ափսե -->
    <section class="preview-card">
      <div class="chef-badge" id="chef-comment">1️⃣ Նախ տապակիր հացը տոստերում, ապա դիր միջուկները</div>

      <!-- Իրական վարդագույն տոստեր -->
      <div class="toaster-zone">
        <div class="toaster-bread-slot" id="toaster-bread-slot"></div>
        <div class="toaster-body" id="toaster-body">
          <div class="toaster-slot-top"></div>
          <div class="toaster-glow"></div>
          <div class="toaster-dial"></div>
          <div class="toaster-lever"></div>
          <div class="toaster-chrome-base"></div>
        </div>
      </div>

      <div class="toast-action-bar">
        <button class="btn btn-primary" id="toast-btn" onclick="runToaster()">
          🔥 Դնել տոստերի մեջ
        </button>
      </div>

      <!-- Ափսե (Drop Zone) -->
      <div class="plate-stage" id="plate-stage">
        <div class="plate" id="plate-el">
          <div class="plate-inner-ring"></div>
        </div>
        <div id="toast-canvas"></div>
      </div>

      <div class="hint-text" id="layer-count">💡 Քաշիր միջուկները ափսեի վրա կամ շարժիր արդեն դրվածները</div>
      <div class="selected-pills" id="selected-pills"></div>

      <div class="preview-controls">
        <button class="btn btn-ghost" onclick="undoTopping()">↩️ Հետ քայլ</button>
        <button class="btn btn-ghost" onclick="clearToast()">🗑️ Սկսել նորից</button>
      </div>

      <button class="btn btn-primary finish-btn" onclick="finishToast()">
        💖 Պատրաստ է — Համտեսել
      </button>
    </section>

    <!-- Աջ վահանակ՝ Ռեալիստիկ Հացեր և 100 Միջուկ -->
    <section class="builder-card">
      <div class="section-title">
        <span>1. Ընտրիր հացի տեսակը</span>
        <span class="badge">8 ռեալիստիկ հաց</span>
      </div>
      <div class="bread-grid" id="bread-grid"></div>

      <div class="section-title">
        <span>2. Քաշիր կամ սեղմիր միջուկները</span>
        <span class="badge">100 միջուկ</span>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>

    // Ռեալիստիկ 3D/ստվերավորված վեկտորային SVG գեներատոր
    function getToppingSVG(t) {
      const gid = 'g_' + t.id;
      const grad = `<defs>
        <radialGradient id="${gid}" cx="35%" cy="30%" r="70%">

      switch (t.type) {
        case 'avocado':
          return `<svg viewBox="0 0 100 100" width="100%" height="100%">

    // Ծրագրի վիճակ (State)
    let selectedBread = BREADS[0];
    let isToasted = false;
    let isToastingNow = false;
    let activeCategory = 'all';
    let placedToppings = [];
    let draggedCatalogId = null;

    function init() {
      renderBreads();
      renderTabs();
      renderToppings();
      renderPlate();
      setupPlateDragAndDrop();
    }

    function renderBreads() {
      const grid = document.getElementById('bread-grid');
      grid.innerHTML = BREADS.map(b => `
        <div class="bread-item ${b.id === selectedBread.id ? 'active' : ''}" onclick="selectBread('${b.id}')">
          <div class="bread-thumb">${getRealisticBreadSVG(b, false)}</div>
          <div class="bread-name">${b.name}</div>
        </div>
      `).join('');
    }

    function selectBread(id) {
      if (isToastingNow) return;
      selectedBread = BREADS.find(b => b.id === id);
      isToasted = false;
      renderBreads();
      renderPlate();
      updateChefComment(`🍞 Ընտրվեց «${selectedBread.name}» — հիմա կարող ես տապակել տոստերում`);
    }

    // Իրական տոստերի անիմացիա
    function runToaster() {
      if (isToastingNow) return;
      isToastingNow = true;

      const btn = document.getElementById('toast-btn');
      const slot = document.getElementById('toaster-bread-slot');
      const body = document.getElementById('toaster-body');

      btn.disabled = true;
      updateChefComment('🔥 Հացը տոստերի մեջ է... կարմրում է');

      // Հացը ցուցադրել տոստերի մեջ
      slot.innerHTML = getRealisticBreadSVG(selectedBread, false);
      slot.classList.remove('popping-out');
      slot.classList.add('in-toaster');

      setTimeout(() => {
        body.classList.add('heating');
      }, 220);

      // Կարմրած հացը դուրս է թռչում
      setTimeout(() => {
        body.classList.remove('heating');
        isToasted = true;
        slot.innerHTML = getRealisticBreadSVG(selectedBread, true);
        slot.classList.remove('in-toaster');
        slot.classList.add('popping-out');
        updateChefComment('✨ Դինգ-դոնգ։ Խրթխրթան հացը պատրաստ է, դիր միջուկները');
      }, 1700);

      // Հայտնվում է ափսեի վրա
      setTimeout(() => {
        slot.classList.remove('popping-out');
        slot.style.opacity = '0';
        renderPlate(true);
        btn.disabled = false;
        isToastingNow = false;
        setTimeout(() => { slot.style.opacity = ''; }, 300);
      }, 2250);
    }

    function renderTabs() {
      const tabs = document.getElementById('category-tabs');
      tabs.innerHTML = CATEGORIES.map(c => `
        <button class="tab-btn ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">
          ${c.label}
        </button>
      `).join('');
    }

    function setCategory(catId) {
      activeCategory = catId;
      renderTabs();
      renderToppings();
    }

    function renderToppings() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const grid = document.getElementById('toppings-grid');

      const filtered = TOPPINGS.filter(t => {
        const matchCat = activeCategory === 'all' || t.cat === activeCategory;
        const matchText = t.name.toLowerCase().includes(query);
        return matchCat && matchText;
      });

      grid.innerHTML = filtered.map(t => {
        const count = placedToppings.filter(p => p.id === t.id).length;
        return `
          <div class="topping-card"
               draggable="true"
               ondragstart="onCatalogDragStart(event, '${t.id}')"
               onclick="addToppingAt('${t.id}', null, null)">
            ${count > 0 ? `<div class="topping-count-badge">${count}</div>` : ''}
            <div class="topping-svg-box">${getToppingSVG(t)}</div>
            <div class="topping-title">${t.name}</div>
          </div>
        `;
      }).join('');
    }

    function onCatalogDragStart(e, id) {
      draggedCatalogId = id;
      e.dataTransfer.setData('text/plain', id);
    }

    // Ափսեի վրա քաշել-գցելու (Drop) կարգավորում
    function setupPlateDragAndDrop() {
      const stage = document.getElementById('plate-stage');
      const plate = document.getElementById('plate-el');

      stage.addEventListener('dragover', (e) => {
        e.preventDefault();
        plate.classList.add('drag-over');
      });

      stage.addEventListener('dragleave', () => {
        plate.classList.remove('drag-over');
      });

      stage.addEventListener('drop', (e) => {
        e.preventDefault();
        plate.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain') || draggedCatalogId;
        if (!id) return;

        const canvas = document.getElementById('toast-canvas');
        const rect = canvas.getBoundingClientRect();
        const xPct = Math.max(15, Math.min(85, ((e.clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(15, Math.min(85, ((e.clientY - rect.top) / rect.height) * 100));

        addToppingAt(id, xPct, yPct);
        draggedCatalogId = null;
      });
    }

    function addToppingAt(id, xPct, yPct) {
      const item = TOPPINGS.find(t => t.id === id);
      if (!item) return;

      const x = xPct !== null ? xPct : 50 + (Math.random() * 28 - 14);
      const y = yPct !== null ? yPct : 52 + (Math.random() * 28 - 14);
      const rot = Math.floor(Math.random() * 40 - 20);

      placedToppings.push({
        uid: Date.now() + Math.random(),
        ...item,
        x,
        y,
        rot
      });

      renderPlate(false);
      renderToppings();
      updateChefComment(`💖 Ավելացվեց «${item.name}» — կարող ես շարժել ցանկացած տեղ`);
    }

    // Արդեն դրված միջուկի ազատ տեղաշարժում (Pointer Events)
    function startMovePlacedTopping(e, uid) {
      e.preventDefault();
      e.stopPropagation();

      const el = e.currentTarget;
      const canvas = document.getElementById('toast-canvas');
      const rect = canvas.getBoundingClientRect();
      const item = placedToppings.find(t => t.uid === uid);
      if (!item) return;

      el.classList.add('dragging');

      function onMove(ev) {
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        const nx = Math.max(12, Math.min(88, ((clientX - rect.left) / rect.width) * 100));
        const ny = Math.max(12, Math.min(88, ((clientY - rect.top) / rect.height) * 100));
        item.x = nx;
        item.y = ny;
        el.style.left = nx + '%';
        el.style.top = ny + '%';
      }

      function onEnd() {
        el.classList.remove('dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onEnd);
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onEnd);
    }

    function removeToppingByUid(uid) {
      placedToppings = placedToppings.filter(t => t.uid !== uid);
      renderPlate(false);
      renderToppings();
    }

    function undoTopping() {
      if (placedToppings.length === 0) return;
      placedToppings.pop();
      renderPlate(false);
      renderToppings();
    }

    function clearToast() {
      placedToppings = [];
      isToasted = false;
      renderPlate(false);
      renderToppings();
      updateChefComment('✨ Սկսենք նոր տոստ պատրաստել');
    }

    function randomToast() {
      placedToppings = [];
      selectedBread = BREADS[Math.floor(Math.random() * BREADS.length)];
      isToasted = true;
      renderBreads();
      const count = 4 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const rand = TOPPINGS[Math.floor(Math.random() * TOPPINGS.length)];
        addToppingAt(rand.id, null, null);
      }
      updateChefComment('🎲 Պատահական շեֆ-տոստը պատրաստ է');
    }

    function renderPlate(animateJump = false) {
      const canvas = document.getElementById('toast-canvas');
      let html = `<div class="bread-layer ${animateJump ? 'jumping' : ''}">${getRealisticBreadSVG(selectedBread, isToasted)}</div>`;

      placedToppings.forEach((t, idx) => {
        html += `
          <div class="topping-layer"
               style="left:${t.x}%; top:${t.y}%; --rot:${t.rot}deg; z-index:${idx + 5};"
               onpointerdown="startMovePlacedTopping(event, ${t.uid})">
            ${getToppingSVG(t)}
          </div>
        `;
      });

      canvas.innerHTML = html;

      document.getElementById('layer-count').textContent =
        placedToppings.length === 0
          ? '💡 Քաշիր միջուկները ափսեի վրա կամ սեղմիր դրանց վրա'
          : `Ընտրված է ${placedToppings.length} միջուկ (կարող ես քաշելով շարժել)`;

      const pills = document.getElementById('selected-pills');
      pills.innerHTML = placedToppings.map(t => `
        <span class="pill" onclick="removeToppingByUid(${t.uid})">${t.name} ✕</span>
      `).join('');
    }

    function updateChefComment(text) {
      document.getElementById('chef-comment').textContent = text;
    }

    function finishToast() {
      const modal = document.getElementById('result-modal');
      const msg = document.getElementById('result-message');
      const summary = document.getElementById('recipe-summary');

      const toastStatus = isToasted ? 'խրթխրթան տապակած' : 'նուրբ թարմ';
      if (placedToppings.length === 0) {
        msg.textContent = `Քո ընտրած ${toastStatus} «${selectedBread.name}» հացը շատ ախորժելի է, բայց մի քանի միջուկ էլ դնես՝ կատարյալ կլինի։`;
        summary.textContent = `Հիմքը՝ ${selectedBread.name} (${toastStatus})`;
      } else {
        const uniqueNames = [...new Set(placedToppings.map(t => t.name))];
        msg.textContent = `Վա՜յ, այս տոստը ուղղակի շա՜տ համեղ է ստացվել։ ${toastStatus.charAt(0).toUpperCase() + toastStatus.slice(1)} «${selectedBread.name}» հացի և քո ձեռքով դասավորված միջուկների համադրությունը իսկական գլուխգործոց է։`;
        summary.innerHTML = `<strong>Քո բաղադրատոմսը.</strong> ${selectedBread.name} (${toastStatus}) + ${uniqueNames.join(', ')}`;
      }

      modal.classList.add('open');
      launchConfetti();
    }

    function closeModal() {
      document.getElementById('result-modal').classList.remove('open');
    }

    function launchConfetti() {
      const colors = ['#ff2e82', '#ff85b6', '#ffd166', '#8cd459', '#ff5c9d'];
      for (let i = 0; i < 45; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-15px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (7 + Math.random() * 8) + 'px';
        el.style.height = el.style.width;
        el.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }
    }

    init();
  </script>
</body>
</html>
